[package]
name = "nexus-db"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Database layer for Nexus — PostgreSQL, SQLite, Redis (optional), local storage"

# Features
# ─────────
# full        (default) — PostgreSQL + Redis + S3/MinIO + MeiliSearch
# storage-lite           — SQLite + local filesystem + tantivy full-text search
#
# In practice the runtime backend is selected by DATABASE_URL (sqlite:// vs postgres://)
# and the --lite flag. Feature flags prevent unused heavy crates from linking.
[features]
default = ["full"]
full = []
storage-lite = []

[dependencies]
nexus-common = { workspace = true }
sqlx = { workspace = true }
# scylla intentionally excluded — not yet wired; avoids large link-time overhead
redis = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
meilisearch-sdk = { workspace = true }
mime_guess = { workspace = true }
tantivy = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
