[package]
name = "nexus-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, utilities, and configuration for Nexus"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
validator = { workspace = true }
bitflags = { workspace = true }
snowflaked = { workspace = true }
config = { workspace = true }
toml = { workspace = true }
dotenvy = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
jsonwebtoken = { workspace = true }
# Fetching Auth's JWKS, and the RwLock guarding the key cache.
reqwest = { workspace = true }
tokio = { workspace = true }
regex = "1.11"
sha2 = { workspace = true }
# Verifies the signed pre-key signature. Already vendored at the workspace
# root; see crypto.rs for why this is dalek rather than a libsignal binding.
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
blake3 = "1"
pqcrypto-kyber = "0.7"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

[dev-dependencies]
# Generates the throwaway RSA keypair the identity tests sign with, so no
# private key material lives in the source of a public repo.
rsa = "0.9"
rand_core = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
