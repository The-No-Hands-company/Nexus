apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nexus.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.service.apiPort }}
              protocol: TCP
            - name: gateway
              containerPort: {{ .Values.service.gatewayPort }}
              protocol: TCP
            - name: voice
              containerPort: {{ .Values.service.voicePort }}
              protocol: TCP
            - name: federation
              containerPort: {{ .Values.service.federationPort }}
              protocol: TCP
          env:
            - name: NEXUS__SERVER__NAME
              value: {{ .Values.config.serverName | quote }}
            - name: NEXUS__SERVER__HOST
              value: "0.0.0.0"
            - name: NEXUS__SERVER__PORT
              value: {{ .Values.service.apiPort | quote }}
            - name: NEXUS__SERVER__GATEWAY_PORT
              value: {{ .Values.service.gatewayPort | quote }}
            - name: NEXUS__SERVER__VOICE_PORT
              value: {{ .Values.service.voicePort | quote }}
            - name: NEXUS__SERVER__FEDERATION_PORT
              value: {{ .Values.service.federationPort | quote }}
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: NEXUS__AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus.secretName" . }}
                  key: jwt-secret
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus.secretName" . }}
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus.secretName" . }}
                  key: redis-password
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus.secretName" . }}
                  key: minio-password
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus.secretName" . }}
                  key: minio-access-key
            - name: SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus.secretName" . }}
                  key: meili-key
            {{- if .Values.postgresql.enabled }}
            - name: NEXUS__DATABASE__URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(DATABASE_PASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: NEXUS__REDIS__URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Release.Name }}-redis-master:6379"
            {{- end }}
            {{- if .Values.minio.enabled }}
            - name: NEXUS__STORAGE__ENDPOINT
              value: "http://{{ .Release.Name }}-minio:9000"
            - name: NEXUS__STORAGE__ACCESS_KEY
              value: "$(STORAGE_ACCESS_KEY)"
            - name: NEXUS__STORAGE__SECRET_KEY
              value: "$(STORAGE_SECRET_KEY)"
            - name: NEXUS__STORAGE__BUCKET
              value: "nexus"
            {{- end }}
            - name: NEXUS__SEARCH__API_KEY
              value: "$(SEARCH_API_KEY)"
            {{- if .Values.meilisearch.enabled }}
            - name: NEXUS__SEARCH__URL
              value: "http://{{ .Release.Name }}-meilisearch:7700"
            {{- else if .Values.meilisearch.url }}
            - name: NEXUS__SEARCH__URL
              value: {{ .Values.meilisearch.url | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
