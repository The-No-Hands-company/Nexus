# ─────────────────────────────────────────────────────────────────────────────
# fly.toml — Nexus Fly.io deployment TEMPLATE
#
# DO NOT put your personal app name or domain here — this file is committed to
# the public repo and shared by all users.
#
# To deploy your own instance:
#   1. Copy this file:  cp deploy/fly.toml deploy/fly.personal.toml
#   2. Edit fly.personal.toml — replace YOUR_APP_NAME with your real app name
#   3. Deploy:          fly deploy -c deploy/fly.personal.toml
#
# fly.personal.toml is listed in .gitignore and will never be committed.
# ─────────────────────────────────────────────────────────────────────────────

app = "YOUR_APP_NAME"   # e.g. nexus-yourname — must match `fly apps create`
primary_region = "ams"  # ams=Amsterdam  lhr=London  iad=US-East  sea=US-West

[build]
  dockerfile = "Dockerfile"

[env]
  NEXUS__SERVER__HOST             = "0.0.0.0"
  NEXUS__SERVER__PORT             = "8080"
  NEXUS__SERVER__GATEWAY_PORT     = "8081"
  NEXUS__SERVER__VOICE_PORT       = "8082"
  NEXUS__SERVER__FEDERATION_PORT  = "8448"
  # Set this to YOUR_APP_NAME.fly.dev  (or your custom domain if you have one)
  NEXUS__SERVER__NAME             = "YOUR_APP_NAME.fly.dev"
  RUST_LOG = "nexus=info,tower_http=warn"
  # Secrets — never put values here, use: fly secrets set KEY=value
  # Required secrets:
  #   NEXUS__AUTH__JWT_SECRET   — openssl rand -hex 64
  #   NEXUS__REDIS__URL         — from Upstash (https://upstash.com) or fly redis
  # DATABASE_URL is set automatically by: fly postgres attach <db-name> --app <app-name>

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/health"

[[services]]
  protocol = "tcp"
  internal_port = 8081

  [[services.ports]]
    port = 8081
    handlers = ["tls"]

[[services]]
  protocol = "tcp"
  internal_port = 8448

  [[services.ports]]
    port = 8448
    handlers = ["tls"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[mounts]
  source = "nexus_data"
  destination = "/app/data"
