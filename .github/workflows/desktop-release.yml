name: Desktop Release

# Build the Nexus desktop client (Tauri 2) and attach the installers to the
# same GitHub Release created by release.yml when a v* tag is pushed.
#
# Artifacts produced per platform:
#   Linux:   nexus-desktop_<version>_amd64.AppImage
#             nexus-desktop_<version>_amd64.deb
#   macOS:   nexus-desktop_<version>_universal.dmg   (x86_64 + aarch64 fat binary)
#   Windows: nexus-desktop_<version>_x64_en-US.msi
#             nexus-desktop_<version>_x64-setup.exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop – ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04

          - platform: macos
            os: macos-14          # Apple Silicon runner; universal binary via MACOSX_DEPLOYMENT_TARGET trick

          - platform: windows
            os: windows-2022

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node.js ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/nexus-desktop/package.json

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary: add both targets
          targets: ${{ matrix.platform == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Rust (cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nexus-desktop/src-tauri -> target

      # ── Linux system dependencies ─────────────────────────────────────────────
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Install npm deps ──────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: crates/nexus-desktop
        run: npm ci

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build desktop app (Linux / Windows)
        if: matrix.platform != 'macos'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sign the Windows installer if certificates are available
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/nexus-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Nexus ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Build desktop app (macOS universal binary)
        if: matrix.platform == 'macos'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS notarisation — requires Apple Developer account secrets
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/nexus-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Nexus ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Build a universal binary targeting both Intel and Apple Silicon
          args: --target universal-apple-darwin
